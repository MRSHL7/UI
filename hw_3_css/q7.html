<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        body{
            background: linear-gradient(
                120deg,
                rgb(223, 223, 126),
                rgb(255, 166, 181),
                rgb(155, 255, 155),
                rgb(255, 163, 163),
                rgb(255, 219, 151),
                rgb(153, 153, 255)
            );
            background-size : 500% 500%;
            animation-name: gd;
            animation-duration: 3s;
            animation-timing-function: ease;
            animation-iteration-count: infinite;
        }
        @keyframes gd{
            0%,
            100%{
                background-position: 0% 50%;
            }
            50%{
                background-position: 100% ;
            }
        }
        table{
            text-align: center;
            width: 100%;
            max-width: 1000px;
            box-shadow: 8px 8px 30px black;
            margin-top: 100px;
            margin-left: 300px;
            padding: 30px; 
            border-collapse: collapse;
        }

        th, td{
            padding: 10px;
        }

        th{
            background-color: rgb(0, 0, 0);
            color:white;
        }

        td:hover{
            cursor: pointer;
            font-weight: bold;
            font-size: 20px;
            transition: transform 0.3s ease-in-out;
            /* transform: rotateX(120deg); */
            /* transform: rotateY(120deg); */
            /* transform: rotateZ(120deg); */
            /* transform: scale(50deg); */
            transform: perspective(50px) rotateX(360deg); 
            /* transform: skew(20deg);  */
        }

        td::before{
            content: "📍";
        }

        tr:nth-child(odd){
            background-color: rgb(99, 0, 102);
        }

    </style>
</head>
<body>
