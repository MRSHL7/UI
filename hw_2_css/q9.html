<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .linear{
            background: linear-gradient(to right, rgb(143, 0, 83), rgb(3, 85, 0), rgb(0, 1, 78), rgb(88, 121, 0), rgb(0, 97, 81) );
            color: white;
            text-align: center;
            padding: 60px;
            margin: 20px 37%;
        }
        .radial{
            background: radial-gradient(circle, rgb(255, 67, 246), rgb(0, 0, 255), rgb(0, 80, 201), rgb(255, 16, 56), rgb(255, 255, 6) );
            color: white;
            text-align: center;
            padding: 60px;
            margin: 20px 37%;
        }
    </style>
</head>
<body>
    <div class="linear"><p>Lorem ipsum, dolor sit amet consectetur adipisicing.</p></div>
    <div class="radial"><p>Lorem ipsum dolor sit amet consectetur adipisicing.</p></div>
</body>
</html>
